<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; media-src 'self' file:; connect-src 'self' http://127.0.0.1:* http://localhost:* https:; img-src 'self' data:" />
  <title>Crystal Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <div id="app">
    <canvas id="starfield" aria-hidden="true"></canvas>
    <canvas id="crystal-canvas" aria-hidden="true"></canvas>
    <div id="aura" aria-hidden="true"></div>

    <header id="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1>Crystal Companion</h1>
      </div>
      <div class="top-actions">
        <button type="button" id="btn-guide" class="ghost-btn" title="User Guide">Guide</button>
        <button type="button" id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.2.6.8 1 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>
          </svg>
        </button>
      </div>
    </header>

    <main id="stage">
      <section id="crystal-stage" aria-label="Living crystal">
        <div id="crystal-caption">
          <p class="pulse-line" id="status-line">Awakening…</p>
        </div>
      </section>

      <section id="chat-panel" aria-label="Crystal dialogue">
        <div id="messages" role="log" aria-live="polite"></div>
        <form id="composer" autocomplete="off">
          <div class="composer-shell">
            <textarea id="prompt" rows="1" placeholder="Ask the crystal — healing, protection, manifestation…" maxlength="4000"></textarea>
            <button type="submit" id="btn-send" title="Send">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3.4 20.6 21 12 3.4 3.4l.1 7.1L15 12 3.5 13.5z"/></svg>
            </button>
          </div>
          <p class="hint" id="model-hint">No model selected</p>
        </form>
      </section>
    </main>

    <!-- Settings -->
    <aside id="settings-drawer" class="drawer" hidden aria-hidden="true">
      <div class="drawer-backdrop" data-close="settings"></div>
      <div class="drawer-panel" role="dialog" aria-labelledby="settings-title">
        <header class="drawer-head">
          <h2 id="settings-title">Attunement</h2>
          <button type="button" class="icon-btn" data-close="settings" aria-label="Close">✕</button>
        </header>
        <div class="drawer-body">
          <label class="field">
            <span>Provider</span>
            <select id="set-provider">
              <option value="openrouter">OpenRouter Cloud</option>
              <option value="ollama">Ollama (Local)</option>
              <option value="openai">OpenAI</option>
              <option value="anthropic">Anthropic</option>
            </select>
          </label>

          <label class="field" data-show="openrouter">
            <span>OpenRouter API Key</span>
            <input type="password" id="set-openrouter-key" placeholder="sk-or-…" autocomplete="off" />
          </label>
          <label class="field" data-show="openai">
            <span>OpenAI API Key</span>
            <input type="password" id="set-openai-key" placeholder="sk-…" autocomplete="off" />
          </label>
          <label class="field" data-show="anthropic">
            <span>Anthropic API Key</span>
            <input type="password" id="set-anthropic-key" placeholder="sk-ant-…" autocomplete="off" />
          </label>
          <label class="field" data-show="ollama">
            <span>Ollama URL</span>
            <input type="text" id="set-ollama-url" placeholder="http://127.0.0.1:11434" />
          </label>

          <label class="field">
            <span class="row-between">
              Model
              <button type="button" id="btn-refresh-models" class="text-btn">Refresh</button>
            </span>
            <select id="set-model">
              <option value="">— select a model —</option>
            </select>
          </label>

          <label class="field">
            <span>Temperature <em id="temp-val">0.85</em></span>
            <input type="range" id="set-temperature" min="0" max="1.5" step="0.05" value="0.85" />
          </label>

          <label class="field">
            <span>System essence</span>
            <textarea id="set-system" rows="5"></textarea>
          </label>

          <div class="field-row">
            <label class="toggle">
              <input type="checkbox" id="set-music" checked />
              <span>Awakening song</span>
            </label>
            <label class="field compact">
              <span>Music</span>
              <input type="range" id="set-music-vol" min="0" max="1" step="0.01" value="0.45" />
            </label>
          </div>
          <div class="field-row">
            <label class="toggle">
              <input type="checkbox" id="set-sfx" checked />
              <span>Crystal tones</span>
            </label>
            <label class="field compact">
              <span>SFX</span>
              <input type="range" id="set-sfx-vol" min="0" max="1" step="0.01" value="0.55" />
            </label>
          </div>
        </div>
        <footer class="drawer-foot">
          <button type="button" id="btn-save-settings" class="primary-btn">Seal settings</button>
        </footer>
      </div>
    </aside>

    <!-- Guide -->
    <aside id="guide-drawer" class="drawer" hidden aria-hidden="true">
      <div class="drawer-backdrop" data-close="guide"></div>
      <div class="drawer-panel wide" role="dialog" aria-labelledby="guide-title">
        <header class="drawer-head">
          <h2 id="guide-title">User Guide</h2>
          <button type="button" class="icon-btn" data-close="guide" aria-label="Close">✕</button>
        </header>
        <div class="drawer-body prose" id="guide-content"></div>
      </div>
    </aside>

    <!-- Boot veil: crystal birth + song -->
    <div id="boot" aria-live="polite">
      <div class="boot-inner">
        <div class="boot-ring"></div>
        <p class="boot-title">Crystal Companion</p>
        <p class="boot-sub">Press to awaken the light</p>
        <button type="button" id="btn-awaken" class="primary-btn awaken">Awaken</button>
      </div>
    </div>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/starfield.js"></script>
  <script src="js/crystal.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
